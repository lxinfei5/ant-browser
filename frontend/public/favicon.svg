<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pp-ripple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="0.55" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <!-- outer ripple ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#pp-ripple)" stroke-width="4" opacity="0.28"/>
  <!-- middle ripple ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#pp-ripple)" stroke-width="4.5" opacity="0.6"/>
  <!-- core identity -->
  <circle cx="32" cy="32" r="11" fill="url(#pp-ripple)"/>
  <!-- active satellite profile -->
  <circle cx="44" cy="20" r="5" fill="#5EEAD4"/>
</svg>
